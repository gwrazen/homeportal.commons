name: Build

# Build z testami na kazdy push i pull request. Publikacja jest osobnym,
# recznym workflow (publish.yml) — ten job niczego nie deployuje.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Galaz jdk17: kod kompiluje sie do release 17, a javac z JDK 8 nie zna flagi
      # --release. Na masterze (linia 6.x) ten sam plik zostaje na JDK 8.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify
