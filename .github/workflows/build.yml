name: Build

# Build z testami na kazdy push i pull request. Publikacja jest osobnym,
# recznym workflow (publish.yml) — ten job niczego nie publikuje.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Galaz jdk17: kod kompiluje sie do release 17. Wersje Gradle'a przypina
      # wrapper w repo — nie instalujemy gradle'a systemowego.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Wrapper jar jest binarny i siedzi w repo; ten krok sprawdza, ze to
      # oryginalna dystrybucja Gradle'a, a nie podmieniony plik.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      # "BUILD SUCCESSFUL" nie dowodzi, ze testy sie wykonaly — Gradle konczy sie
      # zielono takze przy zerze uruchomionych testow. Bramka jest liczba: 139.
      - name: Assert test count
        run: |
          COUNT=$(find . -path '*/build/test-results/test/TEST-*.xml' -print0 \
            | xargs -0 grep -ho 'tests="[0-9]*"' \
            | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          echo "Tests run: $COUNT"
          test "$COUNT" -eq 139 || { echo "Oczekiwano 139 testow, jest $COUNT"; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/TEST-*.xml'
          if-no-files-found: error
