name: Publish to GitHub Packages

# Publikacja jest reczna (workflow_dispatch), bo wersja commons jest release'em
# bez -SNAPSHOT: GitHub Packages NIE pozwala nadpisac raz opublikowanej wersji
# (409 Conflict, a jedyna droga wstecz to skasowanie pakietu z rejestru).
#
# ⚠️ Przed uruchomieniem podbij `version` w build.gradle.kts. Wersja 7.0 jest juz
# wydana — ten workflow odpalony bez podbicia skonczy sie bledem, i tak ma byc.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Testy lecą przed publikacja: artefaktu z rejestru nie da sie cofnac,
      # wiec nie publikujemy niczego, co nie przeszlo pelnego builda.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # Poswiadczenia ida przez srodowisko — Gradle nie czyta ~/.m2/settings.xml,
      # wiec setup-java z server-id nic by tu nie dal.
      - name: Publish
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
